name: Keep Promptini awake

# Pings the Hugging Face Space on a schedule so it never goes idle.
# Override the target by setting a repo variable SPACE_URL (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 min (GitHub may delay scheduled runs under load)
  workflow_dispatch: {}       # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space
        run: |
          URL="${{ vars.SPACE_URL || 'https://becher-zribi-prompt-forge-rag.hf.space' }}"
          echo "Pinging $URL"
          for i in 1 2 3; do
            code=$(curl -sS --max-time 90 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" != "000" ]; then
              echo "Space responded; keep-alive successful."
              exit 0
            fi
            sleep 15
          done
          echo "No response after 3 tries (Space may be cold-starting) — not failing the job."
          exit 0
